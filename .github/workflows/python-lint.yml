name: Python checks

on:
  workflow_call:
    inputs:
      src_folder: { type: string, default: 'src' }
      run_ssort: { type: boolean, default: true }
      run_ty: { type: boolean, default: true }
      run_mypy: { type: boolean, default: false }
      run_ruff-check: { type: boolean, default: true }
      run_ruff-format: { type: boolean, default: true }
      run_bandit: { type: boolean, default: true }
      run_pre-commit: { type: boolean, default: true }
      python_version: { type: string, default: '3.13' }

env:
  CACHE_GLOBS: |
    **/pyproject.toml
    **/uv.lock
  ENDPOINT_WHITELIST: >-
    pypi.org:443
    github.com:443
    releases.astral.sh
    files.pythonhosted.org:443
    *.githubusercontent.com:443
    *.github.com:443

jobs:
  ssort:
    if: ${{ inputs.run_ssort }}

    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ inputs.python_version }}
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --group lint
        env:
          UV_NO_DEFAULT_GROUPS: true

      - run: >-
          ssort
          --check
          --diff .

  ty:
    if: ${{ inputs.run_ty }}

    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ inputs.python_version }}
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --group types
        env:
          UV_NO_DEFAULT_GROUPS: true

      - run: ty check ${{ inputs.src_folder }}

  mypy:
    if: ${{ inputs.run_mypy }}

    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ inputs.python_version }}
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --group types
        env:
          UV_NO_DEFAULT_GROUPS: true

      - id: cache-mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - run: mypy ${{ inputs.src_folder }}

  ruff-check:
    if: ${{ inputs.run_ruff-check }}

    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ inputs.python_version }}
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --group lint
        env:
          UV_NO_DEFAULT_GROUPS: true

      - id: cache-ruff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - id: run-ruff-sarif
        env:
          RUFF_OUTPUT_FORMAT: sarif
          RUFF_OUTPUT_FILE: results.sarif
        run: |
          ruff check

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        if: ( success() || failure() ) && contains('["success", "failure"]', steps.run-ruff-sarif.outcome)
        with:
          sarif_file: results.sarif

      - id: run-ruff
        if: failure() && contains('["failure"]', steps.run-ruff-sarif.outcome)
        env:
          RUFF_OUTPUT_FORMAT: github
        run: |
          ruff check

  ruff-format:
    if: ${{ inputs.run_ruff-format }}

    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ inputs.python_version }}
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --group lint
        env:
          UV_NO_DEFAULT_GROUPS: true

      - id: cache-ruff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

#      - id: run-ruff-sarif
#        env:
#          RUFF_OUTPUT_FORMAT: sarif
#        run: |
#          ruff format --preview > results.sarif

#      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
#        if: ( success() || failure() ) && contains('["success", "failure"]', steps.run-ruff-sarif.outcome)
#        with:
#          sarif_file: results.sarif

      - id: run-ruff
#        if: failure() && contains('["failure"]', steps.run-ruff-sarif.outcome)
#        env:
#          RUFF_OUTPUT_FORMAT: github
        run: |
          ruff format

  bandit:
    if: ${{ inputs.run_bandit }}

    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ inputs.python_version }}
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --group security
        env:
          UV_NO_DEFAULT_GROUPS: true

      - id: run-bandit-sarif
        run: bandit --confidence-level 'medium' --severity-level 'medium' --recursive '${{ inputs.src_folder }}' --format 'sarif' --output 'results.sarif'

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        if: ( success() || failure() ) && contains('["success", "failure"]', steps.run-bandit-sarif.outcome)
        with:
          sarif_file: results.sarif

      - id: run-bandit
        if: failure() && contains('["failure"]', steps.run-bandit-sarif.outcome)
        run: bandit --confidence-level 'medium' --severity-level 'medium' --recursive '${{ inputs.src_folder }}'

  pre-commit:
    if: ${{ inputs.run_pre-commit }}

    runs-on: ubuntu-latest

    needs:
      - bandit
      - ruff-check
      - ruff-format
      - ssort

    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: proxy.golang.org:443 ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ inputs.python_version }}
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --group pre-commit
        env:
          UV_NO_DEFAULT_GROUPS: true

      - id: cache-pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pre-commit-cache
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'pyproject.toml') }}

      - run: pre-commit run --all-files
        env:
          PRE_COMMIT_HOME: .pre-commit-cache
