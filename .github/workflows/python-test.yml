name: Python Tests

on:
  workflow_call:
    inputs:
      test_folder: { type: string, default: 'tests' }
      run_coverage: { type: boolean, default: true }
      install_patchright: { type: boolean, default: false }
      python_version:
        required: false
        type: string
        default: "['3.11', '3.12', '3.13', '3.14']"

env:
  ENDPOINT_WHITELIST: >-
    # macOS
    *.pool.ntp.org
    ocsp.comodoca.com
    ocsp.digicert.com:80
    ocsp.sectigo.com:80
    ocsp2.g.aaplimg.com:443
    # Standard
    *.github.com:443
    *.githubusercontent.com:443
    files.pythonhosted.org:443
    github.com:443
    pypi.org:443
    releases.astral.sh:443

concurrency:
  group: >-
    ${{ github.workflow }}
    -${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python_version) }}
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        resolution:
          - highest
          - lowest-direct

    runs-on: ${{ matrix.os }}

    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          disable-sudo: ${{ !inputs.install_patchright }}
          egress-policy: audit
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: pytest-run-key
        shell: bash
        run: |
          HASH=${{ hashFiles('pyproject.toml') }}
          VAL="${HASH}-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.resolution }}"
          echo "RUN_KEY=$VAL" >> $GITHUB_ENV

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          cache-suffix: ${{ github.workflow }}

      - run: >-
          uv pip install .
          --group ${{ inputs.run_coverage && 'test-coverage' || 'test' }}
        env:
          UV_NO_DEFAULT_GROUPS: true
          UV_RESOLUTION: ${{ matrix.resolution }}

      - run: patchright install-deps
        if: ${{ inputs.install_patchright }}

      - run: patchright install
        if: ${{ inputs.install_patchright }}

      - id: cache-pytest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pytest_cache
          key: pytest-${{ env.RUN_KEY }}

      - run: pytest ${{ inputs.test_folder }}
        env:
          COVERAGE_FILE: .coverage.${{ env.RUN_KEY }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ env.RUN_KEY }}
          path: .coverage.${{ env.RUN_KEY }}
          include-hidden-files: true
          retention-days: 1

  coverage:
    if: ${{ inputs.run_coverage }}

    runs-on: ubuntu-latest

    needs: pytest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: img.shields.io:443 ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-*
          merge-multiple: true

      - id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f
        if: github.event_name != 'workflow_dispatch'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_COVERAGE_FILES: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
