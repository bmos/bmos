name: Python Tests

on:
  workflow_call:
    inputs:
      test_folder: { type: string, default: 'tests' }
      run_coverage: { type: boolean, default: true }
      install_patchright: { type: boolean, default: false }
      python_version:
        required: false
        type: string
        default: "['3.11', '3.12', '3.13', '3.14']"

env:
  CACHE_GLOBS: |
    **/pyproject.toml
    **/uv.lock
  ENDPOINT_WHITELIST: >-
    pypi.org:443
    github.com:443
    releases.astral.sh
    files.pythonhosted.org:443
    *.githubusercontent.com:443
    *.github.com:443

concurrency:
  group: >-
    ${{ github.workflow }}
    -${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python_version) }}
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        resolution:
          - highest
          - lowest-direct

    runs-on: ${{ matrix.os }}

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: ${{ !inputs.install_patchright }}
          egress-policy: ${{ !inputs.install_patchright && 'block' || 'audit' }}
          allowed-endpoints: ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - id: pytest-run-key
        shell: bash
        run: |
          HASH=${{ hashFiles('pyproject.toml') }}
          VAL="${HASH}-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.resolution }}"
          echo "RUN_KEY=$VAL" >> $GITHUB_ENV

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          cache-dependency-glob: ${{ env.CACHE_GLOBS }}

      - run: >-
          uv sync
          --group ${{ inputs.run_coverage && 'test-coverage' || 'test' }}
        env:
          UV_NO_DEFAULT_GROUPS: true
          UV_RESOLUTION: ${{ matrix.resolution }}

      - run: patchright install-deps
        if: ${{ inputs.install_patchright }}

      - run: patchright install
        if: ${{ inputs.install_patchright }}

      - id: cache-pytest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pytest_cache
          key: pytest-${{ env.RUN_KEY }}

      - run: pytest ${{ inputs.test_folder }}
        env:
          COVERAGE_FILE: .coverage.${{ env.RUN_KEY }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ env.RUN_KEY }}
          path: .coverage.${{ env.RUN_KEY }}
          include-hidden-files: true
          retention-days: 1

  coverage:
    if: ${{ inputs.run_coverage }}

    runs-on: ubuntu-latest

    needs: pytest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: img.shields.io:443 ${{ env.ENDPOINT_WHITELIST}}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-*
          merge-multiple: true

      - id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@5d8df5979747514c914e1c5a12335a7cf9a2745f
        if: github.event_name != 'workflow_dispatch'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_COVERAGE_FILES: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
